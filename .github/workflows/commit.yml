name: commit
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - uses: DeterminateSystems/flake-checker-action@v14

      - run: nix flake check
      - run: nix build
      - run: nix fmt -- --check flake.nix

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go mod verify

      - run: go test -race -shuffle=on -count=1 -v ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags integration

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build integration binaries
        env:
          CGO_ENABLED: "0"
        run: |
          go test -tags=integration -c -o "$RUNNER_TEMP/publisher.test" ./avahi
          go build -o "$RUNNER_TEMP/go-avahi-cname" .

      - name: Build isolated Avahi environment
        run: docker build -t cname-integration:local tests/integration

      - name: Run Avahi and CLI integration tests
        run: |
          docker network create cname-integration
          docker run --name cname-integration --network cname-integration \
            --hostname cname-test \
            -e AVAHI_TEST_BINARY=/go-avahi-cname \
            -v "$RUNNER_TEMP/publisher.test:/publisher.test:ro" \
            -v "$RUNNER_TEMP/go-avahi-cname:/go-avahi-cname:ro" \
            cname-integration:local

      - name: Collect failure diagnostics
        if: failure()
        run: |
          if docker container inspect cname-integration > /dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/cname-results"
            docker logs cname-integration > "$RUNNER_TEMP/cname-results/container.log" 2>&1
            docker cp cname-integration:/results/. "$RUNNER_TEMP/cname-results/"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: avahi-integration-diagnostics
          path: ${{ runner.temp }}/cname-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up integration environment
        if: always()
        run: |
          docker rm -f cname-integration || true
          docker network rm cname-integration || true

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up QEMU for cross-compilation of Docker images
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - run: go mod download

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --skip=publish --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker base on Goreleaser
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ fromJSON(steps.goreleaser.outputs.metadata).version }}

      - name: Test build of Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ fromJSON(steps.goreleaser.outputs.metadata).version }}
            COMMIT=${{ fromJSON(steps.goreleaser.outputs.metadata).commit }}
            DATE=${{ fromJSON(steps.goreleaser.outputs.metadata).date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
